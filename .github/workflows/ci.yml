name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, libxml, mbstring, xml, xmlwriter, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test:unit

      - name: Audit dependencies
        run: composer audit

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, json, libxml, mbstring, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse

      - name: Check code style
        run: composer cs:check

  integration:
    name: LibreOffice integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, json, libxml, mbstring, xml, xmlwriter, zip
          coverage: none

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer poppler-utils

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run integration tests
        run: composer test:integration
